[package]
name = "mchose_hub_linux"
version = "0.2.0"
edition = "2021"

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.9", package = "gtk4", features = ["gnome_47"] }
async-channel = "2"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_6"]

[build-dependencies]
glib-build-tools = "0.20"
